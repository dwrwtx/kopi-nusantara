<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Pesan Kopi</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<div class="container mt-5">
  <div class="card shadow p-4">
    <h2>Form Pemesanan</h2>

    <form onsubmit="tambahData(event)">
      <input type="text" id="nama" class="form-control mb-2" placeholder="Nama" required>
      <input type="text" id="produk" class="form-control mb-2" placeholder="Produk" required>
      <input type="number" id="jumlah" class="form-control mb-2" placeholder="Jumlah" required>

      <button class="btn btn-dark">Tambah</button>
    </form>

    <hr>

    <table class="table table-bordered mt-3">
      <thead class="table-dark">
        <tr>
          <th>Nama</th>
          <th>Produk</th>
          <th>Jumlah</th>
        </tr>
      </thead>
      <tbody id="data"></tbody>
    </table>
  </div>
</div>

<script>
function tambahData(e){
  e.preventDefault();

  let nama = document.getElementById("nama").value;
  let produk = document.getElementById("produk").value;
  let jumlah = document.getElementById("jumlah").value;

  document.getElementById("data").innerHTML += `
    <tr>
      <td>${nama}</td>
      <td>${produk}</td>
      <td>${jumlah}</td>
    </tr>
  `;

  document.querySelector("form").reset();
}
</script>

</body>
</html>
