body {

/* container gambar */
.gallery img {
  width: 100%;
  height: 250px;
  object-fit: cover;
  border-radius: 10px;
  transition: 0.3s;
}

/* efek hover 🔥 */
.gallery img:hover {
  transform: scale(1.05);
  filter: brightness(70%);
}

.gallery img:active {
  transform: scale(0.95);
}

.container {

}
</style>
